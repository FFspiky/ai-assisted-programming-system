[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"tests/test_core_security.py" = ["E402"]
"migrations/**" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
