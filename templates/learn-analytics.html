<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习分析 - 基于AIGC的交互式编程学习平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Code+Pro:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4e6ef2;
            --secondary: #8a63d2;
            --accent: #41b883;
            --dark: #1a1c2c;
            --light: #f5f7fa;
            --gray: #a0aec0;
            --success: #48bb78;
            --warning: #ecc94b;
            --danger: #e53e3e;
        }

        /* [保留原有CSS] ... 此处省略大量未改变的CSS代码 ... */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: var(--light);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        /* Glowing Background Effect */
        .glowing {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(78, 110, 242, 0.4), transparent 70%);
            filter: blur(80px);
            z-index: 1;
            animation: float 15s infinite ease-in-out;
        }
        .glowing.glowing-1 {
            display: none !important;
        }

        .glowing-2 {
            bottom: -150px;
            right: -150px;
            background: radial-gradient(circle, rgba(65, 184, 131, 0.4), transparent 70%);
            animation-delay: -5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(20px, 20px);
            }

            50% {
                transform: translate(-20px, 20px);
            }

            75% {
                transform: translate(-20px, -20px);
            }
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            position: relative;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(78, 110, 242, 0.4);
        }

        .logo-icon i {
            font-size: 20px;
            color: white;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            color: var(--light);
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        nav a:hover {
            color: var(--primary);
        }

        nav a.active {
            background: rgba(78, 110, 242, 0.2);
            color: var(--primary);
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-details {
            text-align: right;
        }

        .username {
            font-weight: 600;
            font-size: 16px;
        }

        .user-stats {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: var(--gray);
        }

        .user-stats span, .user-stats a {
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
            color: var(--gray);
        }

        .user-stats span:hover, .user-stats a:hover {
            color: var(--primary);
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--primary);
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .analysis-hero {
            padding: 60px 0 40px;
            text-align: center;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto 40px;
            color: var(--gray);
            line-height: 1.6;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin: 40px 0 30px;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--primary);
            border-radius: 2px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(78, 110, 242, 0.2);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(78, 110, 242, 0.3);
            border-color: rgba(78, 110, 242, 0.4);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background: rgba(78, 110, 242, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .card-icon i {
            font-size: 24px;
            color: var(--primary);
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .chart-container {
            height: 250px;
            margin-top: 20px;
            position: relative;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 10px 0;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stat-label {
            color: var(--gray);
            font-size: 14px;
        }
        
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .learning-path-result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            display: none;
        }

        .error-message {
            color: var(--danger);
            padding: 15px;
            background: rgba(229, 62, 62, 0.1);
            border-radius: 8px;
            border-left: 4px solid var(--danger);
        }

        .path-content {
            max-height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            line-height: 1.7;
        }

        .path-content h3 {
            color: var(--accent);
            margin-top: 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(78, 110, 242, 0.3);
        }

        .path-content ul, .path-content ol {
            padding-left: 20px;
            list-style-type: none;
        }

        .path-content li {
            margin-bottom: 10px;
            position: relative;
            padding-left: 20px;
        }

        .path-content li::before {
            content: "•";
            color: var(--primary);
            font-weight: bold;
            position: absolute;
            left: 0;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            width: 5%;
            transition: width 0.3s ease;
        }

        .question-container {
            min-height: 300px;
            position: relative;
        }

        .question-content {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-align: left;
            color: var(--light);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .option-btn:hover {
            background: rgba(78, 110, 242, 0.2);
            transform: translateY(-2px);
            border-color: rgba(78, 110, 242, 0.4);
        }

        .option-btn.selected {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(78, 110, 242, 0.3);
            border-color: var(--primary);
        }

        .question-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);

             position: relative; /* 确保 z-index 生效 */
            z-index: 10;        /* 提升层级，确保按钮在最上层，不会被遮挡 */
        }

        /* --- 1. 问卷按钮样式修复与美化 --- */
        .nav-btn, .nav-btn-primary, .nav-btn-success {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nav-btn-primary {
            background: var(--primary);
            color: white;
        }
        .nav-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(78, 110, 242, 0.3);
        }

        .nav-btn-success {
            background: var(--accent);
            color: white;
            font-weight: bold;
        }
        .nav-btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(65, 184, 131, 0.3);
        }

        /* 排行榜样式 */
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .leaderboard-table th, .leaderboard-table td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .leaderboard-table th { color: var(--accent); font-weight: 600; }
        .leaderboard-table tr:hover { background: rgba(78, 110, 242, 0.1); }
        .leaderboard-table .rank { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .leaderboard-table .username { font-weight: 500; }

        /* --- AI分析输出美化样式 --- */
#ai-stream-content {
    line-height: 1.8; /* 增加行高，提升可读性 */
    color: var(--gray);
}

#ai-stream-content h3, 
#ai-stream-content h4 {
    color: var(--accent); /* 标题使用醒目的强调色 */
    margin-top: 25px;
    margin-bottom: 15px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(65, 184, 131, 0.3); /* 标题下划线 */

}

#ai-stream-content h3:first-child,
#ai-stream-content h4:first-child {
    margin-top: 0; /* 第一个标题不需要上边距 */
}

#ai-stream-content ul, 
#ai-stream-content ol {

}

#ai-stream-content li {

    position: relative;
}

/* 自定义列表项的符号 */
#ai-stream-content li::before {
    content: '\f058'; /* Font Awesome 的实心对勾图标 */
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    color: var(--primary);
    position: absolute;
    left: -5px;
    top: 2px;
}

#ai-stream-content strong,
#ai-stream-content b {
    color: var(--light); /* 加粗文字使用更亮的颜色 */
    font-weight: 600;
}

#ai-stream-content p {
    margin-bottom: 1rem;
}
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
    const questions = [
        { type: 'radio', question: '1. 您的编程经验时长：', options: ['0-6个月', '6-12个月', '1-3年', '3年以上'] },
        { type: 'radio', question: '2. 您最熟悉的编程语言：', options: ['Python', 'C/C++', 'Go', 'Rust'] },
        { type: 'radio', question: '3. 您使用哪种编程编辑器最频繁？', options: ['VS Code', 'IntelliJ IDEA', 'PyCharm', 'Vim/Neovim', 'Sublime Text', '其他'] },

        { type: 'radio', question: '5. 您对数组(Array)的掌握程度：', options: ['不了解', '了解基本概念', '能实现基本操作', '能解决实际问题'] },
        { type: 'radio', question: '6. 您对哈希表(HashMap/Dictionary)的掌握程度：', options: ['不了解', '了解基本概念', '能实现基本操作', '能解决实际问题'] },
        { type: 'radio', question: '7. 您对树(Tree)结构的掌握程度：', options: ['不了解', '了解基本概念', '能实现基本操作', '能解决实际问题'] },
        { type: 'radio', question: '8. 您对图(Graph)结构的掌握程度：', options: ['不了解', '了解基本概念', '能实现基本操作', '能解决实际问题'] },
        { type: 'radio', question: '9. 您对排序算法的掌握程度：', options: ['不了解', '了解基本概念', '能实现基础算法', '能应用解决实际问题'] },
        { type: 'radio', question: '10. 您对搜索算法的掌握程度：', options: ['不了解', '了解基本概念', '能实现基础算法', '能应用解决实际问题'] },
        { type: 'radio', question: '11. 您对动态规划(DP)的掌握程度：', options: ['不了解', '了解基本概念', '能实现简单DP', '能解决较复杂问题'] },

        { type: 'checkbox', question: '14. 您熟悉哪些编程范型？（多选）', options: ['面向对象', '函数式编程', '响应式编程', '面向切面', '并发编程'] },
        { type: 'checkbox', question: '15. 您最想提升哪些方面的技能？（多选）', options: ['算法能力', '系统设计', '项目架构', '数据库设计', 'API开发', '前端框架', '后端框架', '云服务部署'] },
        { type: 'radio', question: '16. 您参与开发的项目规模：', options: ['无项目经验', '小项目（<1000行代码）', '中型项目（1000-5000行）', '大型项目（5000+行）'] },
        { type: 'radio', question: '17. 您在团队中通常是：', options: ['独立开发者', '功能模块实现者', '架构设计者', '技术负责人'] },
        { type: 'radio', question: '18. 您使用测试框架的经验：', options: ['未编写过测试', '写过简单单元测试', '能进行TDD开发', '具有集成测试经验'] },
        { type: 'radio', question: '19. 您每天能够投入编程学习的时间：', options: ['<1小时', '1-2小时', '2-3小时', '>3小时'] },
        { type: 'checkbox', question: '20. 您的学习目标是：（多选）', options: ['提升求职竞争力', '从事专业开发', '参与开源项目', '开发个人项目', '解决工作问题'] }
    ];

    let currentQuestion = 0;
    const userAnswers = Array(questions.length).fill(null);

    function initAssessment() {
        renderQuestion(currentQuestion);
        document.getElementById('prevBtn').addEventListener('click', goToPrevious);
        document.getElementById('nextBtn').addEventListener('click', goToNext);
        document.getElementById('submitBtn').addEventListener('click', submitAssessment);
        // 修正：直接传递 event 对象
        document.getElementById('questionContainer').addEventListener('click', handleOptionSelect);
    }

    function renderQuestion(index) {
        const question = questions[index];
        const container = document.getElementById('questionContainer');
        let optionsHTML = question.options.map(option => {
            let isSelected = (question.type === 'radio')
                ? (userAnswers[index] === option)
                : (userAnswers[index] && userAnswers[index].includes(option));
            return `<button type="button" class="option-btn ${isSelected ? 'selected' : ''}" data-value="${option}">${option}</button>`;
        }).join('');
        
        container.innerHTML = `<div class="question-content"><h4>${question.question}</h4><div class="options">${optionsHTML}</div></div>`;
        document.getElementById('questionCount').textContent = `${index + 1}/${questions.length}`;
        const progressBar = document.getElementById('progressBar');
        if (progressBar) {
            progressBar.style.width = `${((index + 1) / questions.length) * 100}%`;
        }
        document.getElementById('prevBtn').disabled = index === 0;
        document.getElementById('nextBtn').style.display = index < questions.length - 1 ? 'inline-flex' : 'none';
        document.getElementById('submitBtn').style.display = index === questions.length - 1 ? 'inline-flex' : 'none';
    }

    // 修正：使用 event.target.closest() 
    function handleOptionSelect(event) {
        const optionElement = event.target.closest('.option-btn');
        if (!optionElement) return;

        const question = questions[currentQuestion];
        const optionValue = optionElement.dataset.value;

        if (question.type === 'radio') {
            document.querySelectorAll(`#questionContainer .option-btn`).forEach(btn => btn.classList.remove('selected'));
            optionElement.classList.add('selected');
            userAnswers[currentQuestion] = optionValue;
            if (currentQuestion < questions.length - 1) setTimeout(goToNext, 300);
        } else {
            optionElement.classList.toggle('selected');
            if (!userAnswers[currentQuestion]) userAnswers[currentQuestion] = [];
            const idx = userAnswers[currentQuestion].indexOf(optionValue);
            if (idx > -1) {
                userAnswers[currentQuestion].splice(idx, 1);
            } else {
                userAnswers[currentQuestion].push(optionValue);
            }
        }
    }

    function validateCurrentAnswer() {
        const answer = userAnswers[currentQuestion];
        return answer !== null && (Array.isArray(answer) ? answer.length > 0 : true);
    }

    function goToPrevious() {
        if (currentQuestion > 0) renderQuestion(--currentQuestion);
    }

    function goToNext() {
        if (validateCurrentAnswer()) {
            if (currentQuestion < questions.length - 1) renderQuestion(++currentQuestion);
        } else alert('请完成当前题目');
    }


    // learn-analytics.html

async function submitAssessment() {
    if (!validateCurrentAnswer()) {
        alert('请在提交前完成当前题目'); // 使用 alert 或更美观的提示
        return;
    }

    const loadingElement = document.getElementById('assessmentLoading');
    const preview = document.getElementById('pathPreview');
    const pathContent = document.getElementById('pathContent');
    
    // 准备UI
    document.getElementById('assessmentForm').style.display = 'none'; // 隐藏问卷
    preview.style.display = 'block';
    loadingElement.style.display = 'block'; // 先显示加载动画
    pathContent.style.display = 'none';  // 隐藏旧内容
    pathContent.innerHTML = ''; // 清空之前的内容

    // --- 修改开始：替换整个 try...catch 块 ---
    try {
        const response = await fetch('/api/assess-learning-path', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ answers: userAnswers })
        });
        
        if (!response.ok) {
            throw new Error(`服务器响应错误: ${response.status} ${response.statusText}`);
        }

        // 收到响应后，隐藏加载动画，显示内容容器
        loadingElement.style.display = 'none';
        pathContent.style.display = 'block';

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let fullText = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            // 将接收到的数据块解码并添加到缓冲区
            buffer += decoder.decode(value, { stream: true });
            // 按换行符分割，处理完整的行
            const lines = buffer.split('\n');
            buffer = lines.pop(); // 最后一行可能不完整，放回缓冲区等待下次处理

            for (const line of lines) {
                // 检查是否是有效的 SSE 数据行
                if (line.startsWith('data: ')) {
                    const jsonStr = line.substring(6).trim();
                    if (jsonStr) {
                        try {
                            const data = JSON.parse(jsonStr);
                            // 处理内容数据
                            if (data.content) {
                                fullText += data.content;
                                // 使用 marked.parse (这依然是必要的)
                                pathContent.innerHTML = marked.parse(fullText);
                                pathContent.scrollTop = pathContent.scrollHeight; // 自动滚到底部
                            }
                            // 处理错误数据
                            if (data.error) {
                                pathContent.innerHTML = `<div class="error-message">生成学习路径时出错: ${data.error}</div>`;
                                console.error("Stream Error:", data.error);
                                return; // 收到错误后停止处理
                            }
                        } catch (e) {
                            console.error('解析JSON数据流时出错:', e, '收到的数据:', jsonStr);
                        }
                    }
                }
            }
        }
    } catch (error) {
        console.error('获取学习路径失败:', error);
        loadingElement.style.display = 'none'; // 隐藏加载
        pathContent.style.display = 'block'; // 显示内容区
        pathContent.innerHTML = `<div class="error-message">请求失败: ${error.message}。请检查网络连接或联系管理员。</div>`;
    }
    // --- 修改结束 ---
}
    // --- 页面加载的完整逻辑 (已修正) ---
    document.addEventListener('DOMContentLoaded', function() {
        initAssessment();

    async function checkUserLoginStatus() {
        try {
            const response = await fetch('/api/current_user');
            if (response.ok) {
                const result = await response.json();
                if (result.success) {
                    updateUserInfo(result.user);
                    fetchLearningOverview();
                    fetchAiAnalysisStream();
                } else {
                    showLoginRegister();
                }
            } else {
                showLoginRegister();
            }
        } catch (error) {
            console.error('获取用户信息失败', error);
            showLoginRegister();
        }
    }

    async function fetchLearningOverview() {
        try {
            const response = await fetch('/api/learning_overview');
            const result = await response.json();
            if (result.success) {
                document.getElementById('totalSolved').textContent = result.data.total_solved;
                document.getElementById('learningHours').textContent = result.data.learning_hours + 'h';
                document.getElementById('accuracyRate').textContent = result.data.accuracy + '%';
            }
        } catch (error) {
            console.error('获取学习概览失败:', error);
        }
    }

    async function fetchLeaderboard() {
        const container = document.getElementById('leaderboardContainer');
        try {
            const response = await fetch('/api/leaderboard');
            const result = await response.json();
            if (result.success && result.data.length > 0) {
                let tableHTML = '<table class="leaderboard-table"><thead><tr><th>排名</th><th>用户</th><th>解题数</th><th>学习时长 (h)</th></tr></thead><tbody>';
                result.data.forEach(user => {
                    tableHTML += `
                        <tr>
                            <td class="rank">${user.rank}</td>
                            <td class="username">${user.username}</td>
                            <td>${user.solved_count}</td>
                            <td>${user.learning_hours}</td>
                        </tr>
                    `;
                });
                tableHTML += '</tbody></table>';
                container.innerHTML = tableHTML;
            } else {
                container.innerHTML = '<p style="text-align:center; color:var(--gray);">英雄榜正在等待第一位英雄的诞生！</p>';
            }
        } catch (error) {
            container.innerHTML = `<p class="error-message">网络错误: ${error.message}</p>`;
        }
    }

    async function fetchAiAnalysisStream() {
        const container = document.getElementById('aiAnalysisContainer');
        container.innerHTML = `<div class="card-body path-content" id="ai-stream-content"></div>`;
        const contentDiv = document.getElementById('ai-stream-content');
        
        try {
            const response = await fetch('/api/ai_learning_analysis_stream');
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullContent = ''; 

            while (true) {
                const { done, value } = await reader.read();
                if (done) break; 
                
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const jsonStr = line.substring(6);
                        if (!jsonStr) continue;
                        
                        try {
                            const data = JSON.parse(jsonStr);
                            if(data.content) {
                                fullContent += data.content;
                                contentDiv.innerHTML = marked.parse(fullContent);
                                contentDiv.scrollTop = contentDiv.scrollHeight;
                            }
                            if(data.error) {
                                contentDiv.innerHTML = `<p class="error-message">${data.error}</p>`;
                                return;
                            }
                        } catch(e) {
                            // 忽略JSON解析错误
                        }
                    }
                }
            }
        } catch (error) {
            contentDiv.innerHTML = `<p class="error-message">请求AI分析时发生错误: ${error.message}</p>`;
        }
    }
