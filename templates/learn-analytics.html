<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习分析 - 基于AIGC的交互式编程学习平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Code+Pro:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/learn-analytics.css') }}">
</head>

<body>
    <div class="container">
        <div class="glowing glowing-1"></div>
        <div class="glowing glowing-2"></div>

        <header>
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-users"></i></div>
                <div class="logo-text">说的都队</div>
            </div>
            <nav>
                <ul>
                    <li><a href="./index.html">首页</a></li>
                    <li><a href="./problem_selector.html">刷题</a></li>
                    <li><a href="./learn-analytics.html" class="active">学习分析</a></li>
                    <li><a href="https://baike.baidu.com/item/%E4%BA%BA%E5%B7%A5%E6%99%BA%E8%83%BD%E7%94%9F%E6%88%90%E5%86%85%E5%AE%B9/65200497">了解更多</a></li>
                </ul>
            </nav>

            <div class="user-info">
                <div class="user-details">
                    <div class="username">访客</div>
                    <div class="user-stats">
                        <a href="/login.html">登录</a>
                        <a href="/register.html">注册</a>
                    </div>
                </div>
                <div class="user-avatar" id="userAvatar">
                    <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2EwYWVjMCI+PHBhdGggZD0iTTEyIDJDNi40OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTRjLTIuNjcgMC04IDEuMzQtOCA0djJoMTZjMC0yLjY2LTUuMzMtNC04LTR6Ii8+PC9zdmc+" alt="默认头像">
                </div>
            </div>
        </header>

        <section class="analysis-hero">
            <h1 class="hero-title">学习分析与成长路径</h1>
            <p class="hero-subtitle">基于AI的深度学情分析，实时追踪您的学习轨迹，发现薄弱环节，推荐个性化提升方案</p>
        </section>

        <div class="card">
            <div class="card-header">
                <div class="card-icon"><i class="fas fa-clipboard-list"></i></div>
                <h3 class="card-title">编程能力评估问卷 <span id="questionCount">1/20</span></h3>
            </div>
            <div class="card-body">
                <form id="assessmentForm" style="position: relative;">
                    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
                    <div id="questionContainer" class="question-container"></div>
                    <div class="question-nav">
                        <button type="button" id="prevBtn" class="nav-btn" disabled><i class="fas fa-arrow-left"></i> 上一题</button>
                        <button type="button" id="nextBtn" class="nav-btn-primary">下一题 <i class="fas fa-arrow-right"></i></button>
                        <button type="button" id="submitBtn" class="nav-btn-success" style="display: none;">立刻获得个性化学习路径！ <i class="fas fa-rocket"></i></button>
                    </div>
                </form>
                <div id="get-path-container" style="display: none; text-align: center; margin-top: 20px;"></div>
            </div>
        </div>

        <div id="pathPreview" class="card" style="display:none; margin-top: 25px;">
            <div class="card-header">
                <div class="card-icon"><i class="fas fa-road"></i></div>
                <h3 class="card-title">您的个性化学习路径</h3>
            </div>
            <div class="card-body">
                <div id="assessmentLoading" style="text-align: center; padding: 20px;">
                    <div class="loader" style="margin: 0 auto 15px; width: 40px; height: 40px; border-width: 4px;"></div>
                    <p>AI正在为您分析和规划路径...</p>
                </div>
                <div id="pathContent" class="path-content" style="display:none;"></div>
            </div>
        </div>

                <h2 class="section-title">学习概览</h2>
            <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">总完成题数</div>
                <div class="stat-value" id="totalSolved">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">学习总时长</div>
                <div class="stat-value" id="learningHours">0h</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">平均正确率</div>
                <div class="stat-value" id="accuracyRate">0%</div>
            </div>
            </div>

        <h2 class="section-title">英雄榜</h2>
            <div class="card">
                <div class="card-header">
                    <div class="card-icon"><i class="fas fa-trophy"></i></div>
                    <h3 class="card-title">Top 10 Learners</h3>
                </div>
                <div class="card-body" id="leaderboardContainer">
                    <div class="loader"></div>
                </div>
            </div>

       <h2 class="section-title">AI 深度分析与建议</h2>
        <div id="aiAnalysisContainer" class="card">
            <div class="card-body" style="min-height: 150px;">
                <div class="loader"></div>
                <p style="text-align:center;">正在拉取您的学习数据并请求AI分析...</p>
            </div>
        </div>

        </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='js/learn-analytics.js') }}"></script>
</body>
</html>
