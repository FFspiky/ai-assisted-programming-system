<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库 · 智练 CodeLab</title><link rel="icon" href="/static/images/brand-v1/logo.png">
<link rel="stylesheet" href="/static/css/shared.css"><link rel="stylesheet" href="/static/css/problem-library.css"><link rel="stylesheet" href="/static/css/ocean-theme.css">
</head>
<body class="ocean-theme library-page"><div class="container">
<header><a class="logo" href="/index.html"><img class="codelab-brand-mark" src="/static/images/brand-v1/logo.png" alt="" width="44" height="44"><span class="logo-text">智练 CodeLab</span></a>
<nav aria-label="主导航"><ul><li><a href="/index.html">首页</a></li><li><a class="active" href="/problem_selector.html" aria-current="page">刷题</a></li><li><a href="/co-create.html">AI 共创</a></li><li><a href="/task-room.html">实战任务室</a></li><li><a href="/learn-analytics.html">学习分析</a></li></ul></nav><div class="user-info"></div></header>
<main><div class="library-heading"><div><span class="library-eyebrow">练习 · 积累 · 理解</span><h1>选择题目</h1><p>从一个知识点出发，把一次练习变成自己的理解。</p></div><span id="libraryTotal" class="library-total"></span></div>
<section class="library-filters" aria-label="题目筛选">
<form id="librarySearch" role="search"><label class="sr-only" for="searchInput">搜索题号或标题</label><input id="searchInput" type="search" placeholder="搜索题号或标题…" maxlength="100"><button type="submit">搜索</button></form>
<div class="library-filter-row">
<label for="categoryFilter">分类<select id="categoryFilter"><option value="">全部分类</option></select></label>
<label for="difficultyFilter">难度<select id="difficultyFilter"><option value="">全部难度</option><option>简单</option><option>中等</option><option>困难</option></select></label>
<label for="stateFilter">练习状态<select id="stateFilter" disabled><option value="">全部状态</option><option value="unattempted">未尝试</option><option value="attempted">尝试未通过</option><option value="accepted">已通过</option></select></label>
<button type="button" id="clearFilters" class="secondary">清空筛选</button><span id="stateHint">登录后可筛选练习状态</span></div></section>
<div class="library-results-heading"><p id="resultCount" role="status" aria-live="polite">正在加载题目…</p><span>Python / C++ · 标准输入输出</span></div>
<div id="libraryError" role="alert" hidden><span></span><button id="retryLibrary" type="button">重新加载</button></div>
<div id="libraryEmpty" class="library-empty" hidden><h2>没有找到匹配的题目</h2><p>试试其他分类或关键词，也可以清空筛选。</p><button type="button" id="emptyClear">清空筛选</button></div>
<div class="problem-grid" id="problemGrid" aria-busy="true"></div>
<nav class="library-pagination" aria-label="题库分页"><button type="button" id="previousPage">上一页</button><span id="pagePosition"></span><button type="button" id="nextPage">下一页</button></nav>
</main></div><script src="/static/js/user-session.js"></script><script src="/static/js/problem-library.js"></script></body></html>
