<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题挑战 - 智练 CodeLab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Code+Pro:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/practice.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/evidence.css') }}">
</head>

<body>
    <div class="container">
        <div class="glowing glowing-1"></div>
        <div class="glowing glowing-2"></div>

        <header>
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="logo-text">智练 CodeLab</div>
                </div>
            </div>

            <nav>
                <ul>
                    <li><a href="./index.html">首页</a></li>
                    <li><a href="./problem_selector.html">刷题</a></li>
                    <li><a href="./learn-analytics.html">学习分析</a></li>
                </ul>
            </nav>

            <div class="user-info">
                <div class="user-details">
                    <div class="username">访客</div>
                    <div class="user-stats">
                        <a href="/login.html">登录</a>
                        <a href="/register.html">注册</a>
                    </div>
                </div>
                <div class="user-avatar">
                    <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2EwYWVjMCI+PHBhdGggZD0iTTEyIDJDNi40OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTRjLTIuNjcgMC04IDEuMzQtOCA0djJoMTZjMC0yLjY2LTUuMzMtNC04LTR6Ii8+PC9zdmc+" alt="默认头像">
                </div>
            </div>
        </header>

        <div class="problem-container">
            <div class="problem-section">
                <div class="problem-nav">
                    <a href="./problem_selector.html" class="back-to-home-btn">
                        <i class="fas fa-list"></i> 选择题目
                    </a>
                    <a href="#" class="back-to-home-btn" id="prevProblemBtn" title="">
                        <i class="fas fa-arrow-left"></i> 上一题
                    </a>
                    <div class="problem-status-group">
                        <span class="problem-progress" id="problemProgress">题目 -/-</span>
                        <span class="problem-passed-badge" id="problemPassedBadge" hidden>
                            <i class="fas fa-check-circle"></i> 已通过
                        </span>
                    </div>
                    <a href="#" class="back-to-home-btn" id="nextProblemBtn" title="">
                        <i class="fas fa-arrow-right"></i> 下一题
                    </a>
                </div>

                <div class="problem-header">
                    <h2 class="problem-title">题目区域</h2>
                </div>

                <div class="problem-content">
                </div>

                <div class="editor-container">
                    <div class="editor-header">
                        <div class="editor-title">
                            <i class="fas fa-code"></i>
                            <span>代码编辑器</span>
                        </div>
                        <div class="editor-header">

                            <div class="editor-actions">
	                                <select id="languageSelector">
	                                    <option value="python">Python</option>
	                                    <option value="cpp">C++</option>
	                                </select>
                                <button class="btn btn-ai" id="optimizeBtn">
                                    <i class="fas fa-wand-magic-sparkles"></i>
                                    AI优化
                                </button>
                                <button class="btn btn-run" id="runBtn">
                                    <i class="fas fa-play"></i>
                                    运行代码
                                </button>
                                <button class="btn btn-submit" id="submitBtn">
                                    <i class="fas fa-paper-plane"></i>
                                    提交解答
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="editor-tools">
                        <span class="completion-label" title="输入后自动建议代码，Tab 接受，Esc 取消">自动补全已开启 · Tab 接受</span>
                        <span id="draftStatus" role="status">草稿自动保存</span>
                    </div>
                    <div class="code-editor-wrapper">
                        <div id="ghostLayer"></div>
                        <textarea class="code-area" id="codeInput" placeholder="在此输入您的代码..."></textarea>
                    </div>
                    <div class="inline-hint" id="inlineHint">Tab 接受 / Esc 取消</div>
                    <div class="input-area"
                        style="padding: 15px 20px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                        <div class="output-title" style="margin-bottom: 10px;">
                            <i class="fas fa-keyboard"></i>
                            <span>标准输入 (Standard Input)</span>
                        </div>
                        <textarea id="customInput" placeholder="如果代码需要输入，请在此处提供测试数据..."
                            style="width: 100%; min-height: 80px; background: #1e1e2e; color: #f8f8f2; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px; font-family: 'Source Code Pro', monospace; resize: vertical;"></textarea>
                    </div>
                    <div class="output-area">
                        <div class="output-title">
                            <i class="fas fa-terminal"></i>
                            <span>运行结果</span>
                        </div>
                        <div id="outputContent">
                            <p>代码输出将显示在此处...</p>
                        </div>

                        <section id="submissionResults" class="submission-results" hidden>
                            <p id="evidenceSummary" class="result-summary"></p>
                            <p id="evidenceStale" class="stale-note" hidden>代码已修改，以下是上次提交的结果。</p>
                            <div id="evidenceCases" class="case-list"></div>
                            <details id="submissionCodePanel" hidden>
                                <summary>本次提交的代码</summary>
                                <div id="submissionCode" class="snapshot-code"></div>
                            </details>
                            <div class="diagnosis-actions">
                                <button type="button" id="diagnoseBtn" class="btn btn-ai" disabled>分析错误</button>
                                <button type="button" id="cancelDiagnosisBtn" class="evidence-button" hidden>取消</button>
                            </div>
                            <p id="diagnosisStatus" role="status" aria-live="polite"></p>
                            <div id="diagnosisContent"></div>
                        </section>

                        <div class="ai-response" id="optimizationResult" hidden>
                            <h4><i class="fas fa-lightbulb"></i> AI建议</h4>
                            <p id="aiSuggestion">AI建议将显示在此处...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="ai-floating-window hidden" id="aiFloatingWindow" role="dialog" aria-labelledby="aiChatTitle" data-avatar="{{ url_for('static', filename='images/dafeiyu/portrait.png') }}">
            <div class="ai-assistant-section">
                <div class="ai-header" id="aiDragHandle" tabindex="0" title="按住标题栏拖动；聚焦后用方向键移动">
                    <div class="ai-avatar">
                        <img src="{{ url_for('static', filename='images/dafeiyu/portrait.png') }}" alt="达菲郁的鲸鱼娘头像" draggable="false">
                    </div>
                    <div>
                        <div class="ai-title" id="aiChatTitle">达菲郁</div>
                        <div class="ai-status">编程学习伙伴</div>
                    </div>
                    <div class="chat-window-actions">
                        <button type="button" id="resetChatWindow" class="chat-icon-btn" aria-label="恢复默认位置和大小" title="恢复默认位置和大小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M3 3l6 6m12-6-6 6M3 21l6-6m12 6-6-6"/></svg></button>
                        <button type="button" id="closeChatWindow" class="chat-icon-btn" aria-label="收起达菲郁" title="收起"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg></button>
                    </div>
                </div>

                <div class="chat-container" id="chatContainer" aria-label="与达菲郁的对话"></div>

                <div class="chat-context-controls">
                    <button type="button" id="attachPracticeContext" class="chat-context-btn" aria-pressed="false" title="下一条消息附带当前题目、代码、输入和最近提交结果">附带当前练习</button>
                    <span id="chatContextStatus" aria-live="polite"></span>
                </div>
                <div class="input-container">
                    <input type="text" class="message-input" id="messageInput" placeholder="向达菲郁提问...">
                    <button type="button" id="stopChat" class="chat-context-btn" hidden>停止生成</button>
                    <button class="send-btn" id="sendMessage" aria-label="发送消息">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m21 3-6 18-4-8-8-4 18-6ZM11 13 21 3"/></svg>
                    </button>
                </div>
            </div>
            <button type="button" id="chatResizeHandle" class="chat-resize-handle" aria-label="调整对话框大小" title="拖动调整大小；方向键调整"></button>
        </div>

        <button class="ai-toggle-btn" id="aiToggleBtn" aria-label="打开达菲郁编程助手" aria-expanded="false" aria-controls="aiFloatingWindow" title="达菲郁 · 点击聊天，按住拖动">
            <span class="pet-sprite" aria-hidden="true"></span>
        </button>
    </div>

    <script src="{{ url_for('static', filename='js/user-session.js') }}"></script>
    <script src="{{ url_for('static', filename='js/safe-content.js') }}"></script>
    <script src="{{ url_for('static', filename='js/practice.js') }}"></script>
    <script src="{{ url_for('static', filename='js/evidence.js') }}"></script>
</body>

</html>
