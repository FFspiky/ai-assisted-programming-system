<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题挑战 - 基于AIGC的交互式编程学习平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Code+Pro:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/practice.css') }}">
</head>

<body>
    <div class="container">
        <div class="glowing glowing-1"></div>
        <div class="glowing glowing-2"></div>

        <header>
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="logo-text">说的都队</div>
                </div>
                 <div class="theme-selector">
                    <i class="fas fa-palette"></i>
                    <select id="themeSelector">
                        <option value="default">默认主题</option>
                        <option value="dark">炫彩科技</option>
                        <option value="light">梦幻灵动</option>
                        <option value="blue">像素世界</option>
                    </select>
                </div>
            </div>

            <nav>
                <ul>
                    <li><a href="./index.html">首页</a></li>
                    <li><a href="./problem_selector.html">刷题</a></li>
                    <li><a href="./learn-analytics.html">学习分析</a></li>
                    <li><a href="https://baike.baidu.com/item/%E4%BA%BA%E5%B7%A5%E6%99%BA%E8%83%BD%E7%94%9F%E6%88%90%E5%86%85%E5%AE%B9/65200497" target="_blank">了解更多</a></li>
                </ul>
            </nav>

            <div class="user-info">
                <div class="user-details">
                    <div class="username">小唐克</div>
                    <div class="user-stats">
                        <span id="showRecords">刷题记录</span>
                        <span>积分: 1280</span>
                    </div>
                </div>
                <div class="user-avatar" id="userAvatar">
                    <img src="https://mms1.baidu.com/it/u=1390447151,3494080119&fm=253&app=138&f=JPEGw=500&h=500">
                </div>
            </div>
        </header>

        <div class="problem-container">
            <div class="problem-section">
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <a href="./index.html" class="back-to-home-btn">
                        <i class="fas fa-arrow-left"></i> 返回首页
                    </a>
                    <a href="./problem_selector.html" class="back-to-home-btn">
                        <i class="fas fa-list"></i> 选择题目
                    </a>
                    <a href="#" class="back-to-home-btn" id="nextProblemBtn" title="">
                        <i class="fas fa-arrow-right"></i> 下一题
                    </a>
                </div>

                <div class="problem-header">
                    <h2 class="problem-title">题目区域</h2>
                </div>

                <div class="problem-content" style="width:650.88px; height: auto;">
                </div>

                <div class="editor-container">
                    <div class="editor-header">
                        <div class="editor-title">
                            <i class="fas fa-code"></i>
                            <span>代码编辑器</span>
                        </div>
                        <div class="editor-header">

                            <div class="editor-actions">
	                                <select id="languageSelector">
	                                    <option value="python">Python</option>
	                                    <option value="cpp">C++</option>
	                                </select>
                                <button class="btn btn-ai" id="optimizeBtn">
                                    <i class="fas fa-wand-magic-sparkles"></i>
                                    AI优化
                                </button>
                                <button class="btn btn-run" id="runBtn">
                                    <i class="fas fa-play"></i>
                                    运行代码
                                </button>
                                <button class="btn btn-submit" id="submitBtn">
                                    <i class="fas fa-paper-plane"></i>
                                    提交解答
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="code-editor-wrapper">
                        <div id="ghostLayer"></div>
                        <textarea class="code-area" id="codeInput" placeholder="在此输入您的代码..."></textarea>
                    </div>
                    <div class="inline-hint" id="inlineHint">Tab 接受 / Esc 取消</div>
                    <div class="input-area"
                        style="padding: 15px 20px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                        <div class="output-title" style="margin-bottom: 10px;">
                            <i class="fas fa-keyboard"></i>
                            <span>标准输入 (Standard Input)</span>
                        </div>
                        <textarea id="customInput" placeholder="如果代码需要输入，请在此处提供测试数据..."
                            style="width: 100%; min-height: 80px; background: #1e1e2e; color: #f8f8f2; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px; font-family: 'Source Code Pro', monospace; resize: vertical;"></textarea>
                    </div>
                    <div class="output-area">
                        <div class="output-title">
                            <i class="fas fa-terminal"></i>
                            <span>运行结果</span>
                        </div>
                        <div id="outputContent">
                            <p>代码输出将显示在此处...</p>
                        </div>

                        <div class="ai-response">
                            <h4><i class="fas fa-lightbulb"></i> AI建议</h4>
                            <p id="aiSuggestion">AI建议将显示在此处...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="ai-floating-window hidden" id="aiFloatingWindow">
            <div class="ai-assistant-section">
                <div class="ai-header">
                    <div class="ai-avatar">
                        <i class="fas fa-robot floating"></i>
                    </div>
                    <div>
                        <div class="ai-title">AI编程助手</div>
                        <div class="ai-status">在线</div>
                    </div>
                </div>

                <div class="chat-container" id="chatContainer">
                    <div class="message ai-message">
                        <div class="message-header">
                            <i class="fas fa-robot"></i>
                            AI助手
                        </div>
                        <div class="message-content">
                            你好！我是你的AI编程助手，有什么问题可以随时问我。
                        </div>
                    </div>
                </div>

                <div class="input-container">
                    <input type="text" class="message-input" id="messageInput" placeholder="向AI助手提问...">
                    <button class="send-btn" id="sendMessage">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>

        <button class="ai-toggle-btn" id="aiToggleBtn">
            <img src="{{ url_for('static', filename='images/wa.png') }}" alt="AI 助手图标" class="ai-icon">
        </button>
    </div>

    <script src="{{ url_for('static', filename='js/practice.js') }}"></script>
</body>

</html>
