<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题挑战 - 基于AIGC的交互式编程学习平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Code+Pro:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 默认主题 (基于 practice1.html 的样式) */
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --light: #f8f9fa;
            --dark: #121826;
            --darker: #0c101c;
            --success: #4cc9f0;
            --warning: #f72585;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --code-bg: #1e293b;
            --frog-green: #4CAF50;
            --ai-purple: #8a2be2;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, var(--darker), var(--dark));
            color: var(--light);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* 炫彩科技主题 */
        [data-theme="dark"] {
            --primary: #ff2a6d;
            --secondary: #ffd166;
            --accent: #05d9e8;
            --light: #ececec;
            --dark: #100a35;
            --darker: #080611;
            --success: #05d9e8;
            --warning: #ff2a6d;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --text-accent: var(--accent);
        }

        [data-theme="dark"] body {
            background-image: url('/static/images/科技.jpg');
            background-size: cover;
            background-attachment: fixed;
        }

        /* 梦幻灵动主题 */
        [data-theme="light"] {
            --primary: #4ecdc4;
            --secondary: #3dbbaf;
            --accent: #ff6b6b;
            --light: #292f36;
            /* 深色文字以保证可读性 */
            --dark: #f7fff7;
            /* 浅色背景 */
            --darker: #eaf4f4;
            --success: #6bcb77;
            --warning: #ff8c42;
            --gray: #9aa3b1;
            --light-gray: #f0f4f8;
            --code-bg: #eaf4f4;
        }

        [data-theme="light"] body {
    background-image: url('/static/images/灵眸与影.jpg');
    background-size: cover;
    background-position: center 10%;  
    background-attachment: fixed;
    background-repeat: no-repeat;
}
        
        [data-theme="light"] nav a {
             color: var(--light);
        }

        /* 像素世界主题 */
        [data-theme="blue"] {
            --primary: #00a8cc;
            --secondary: #007ea7;
            --accent: #ffd166;
            --light: #eef7ff;
            --dark: #003459;
            --darker: #00171f;
            --success: #00b894;
            --warning: #e74c3c;
        }

        [data-theme="blue"] body {
            background-image: url('/static/images/像素.jpg');
            background-size: cover;
            background-attachment: fixed;
        }

       
        
        /* 确保在浅色主题下，特定元素的颜色反转以保证可读性 */
        [data-theme="light"] .logo-text,
        [data-theme="light"] .problem-title,
        [data-theme="light"] .ai-title {
             -webkit-text-fill-color: initial; /* 移除透明填充 */
             color: var(--dark); /* 使用主题深色 */
             background: none; /* 移除渐变背景 */
        }
        
        [data-theme="light"] .btn-ai {
            color: var(--dark);
            background: rgba(0,0,0,0.1);
        }
        [data-theme="light"] .btn-ai:hover {
            background: rgba(0,0,0,0.2);
        }
        [data-theme="light"] .message-input {
            color: var(--dark);
            background: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        .container {
            width: 90%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            padding: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            font-size: 2.5rem;
            color: var(--success);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
            margin-left: 30px; /* 与Logo和主题选择器保持距离 */
        }

        nav a {
            color: var(--light);
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            transition: color 0.3s;
            position: relative;
        }

        nav a:hover {
            color: var(--accent);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* 美化后的主题选择器 */
        .theme-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-selector i {
            color: var(--accent);
            font-size: 1.2rem;
            transition: color 0.3s;
        }
        
        #themeSelector {
            padding: 8px 15px;
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--light);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; /* 圆角更大 */
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="16" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 12px;
            padding-right: 40px; /* 为箭头留出空间 */
        }

        #themeSelector:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(var(--accent), 0.5);
        }
        
        #themeSelector option {
            background: var(--darker);
            color: var(--light);
        }
        
        /* 浅色主题下的选择器样式 */
        [data-theme="light"] #themeSelector {
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--light);
            border-color: rgba(0, 0, 0, 0.1);
            background-image: url('data:image/svg+xml;utf8,<svg fill="black" height="16" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
        }
        
        [data-theme="light"] #themeSelector option {
            background: var(--darker);
            color: var(--light);
        }

        .glowing {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent), transparent 70%);
            filter: blur(80px);
            opacity: 0.2;
            z-index: -1;
        }

        .glowing-1 {
            top: 20%;
            left: 10%;
        }

        .glowing-2 {
            bottom: 20%;
            right: 10%;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--frog-green), #2E7D32);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .username {
            font-weight: 500;
            font-size: 1.1rem;
        }

        .user-stats {
            font-size: 0.85rem;
            color: var(--light-gray);
            display: flex;
            gap: 10px;
        }

        .user-stats span {
            cursor: pointer;
            transition: color 0.3s;
        }

        .user-stats span:hover {
            color: var(--accent);
        }

        .problem-container {
            display: flex;
            gap: 30px;
            margin: 40px 0;
            min-height: 75vh;
            width: 100%;
        }

        .problem-section {
            flex: 1;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        [data-theme="light"] .problem-section {
    background: rgba(255, 255, 255, 0.85); /* 提高透明度至85% */
    backdrop-filter: blur(5px);            /* 添加毛玻璃效果 */
}

        .problem-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .problem-title {
            font-size: 1.8rem;
            background: linear-gradient(to right, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .problem-meta {
            display: flex;
            gap: 15px;
            color: var(--light-gray);
            font-size: 0.9rem;
        }

        .problem-difficulty {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .difficulty-easy {
            background: rgba(76, 201, 240, 0.15);
            color: var(--success);
        }

        .difficulty-medium {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
        }

        .problem-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .problem-content h3 {
            color: var(--accent);
            margin: 20px 0 10px;
        }

        .problem-content p {
            margin-bottom: 15px;
            line-height: 1.7;
        }

        .code-block {
            background: var(--code-bg);
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: 'Source Code Pro', monospace;
            overflow-x: auto;
        }

        .editor-container {
            background: rgba(23, 33, 50, 0.9);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        [data-theme="light"] .editor-container {
    background: rgba(239, 244, 244, 0.95); 
}

        .editor-header {
            background: rgba(23, 33, 50, 0.9);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .editor-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .editor-title i {
            font-size: 1.2rem;
        }

        .editor-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-run {
            background: linear-gradient(to right, var(--accent), var(--success));
            color: white;
        }

        .btn-run:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
        }

        .btn-ai {
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
        }

        .btn-ai:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-submit {
            background: linear-gradient(to right, var(--frog-green), #2E7D32);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.4);
        }

        .code-editor-wrapper {
            position: relative;
            background: #1e1e2e;
        }

        [data-theme="light"] .code-editor-wrapper {
            background: #fdf6e3; /* Solarized Light like theme */
        }

        #ghostLayer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px;
            font-family: 'Source Code Pro', monospace;
            font-size: 1rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            pointer-events: none;
            overflow: hidden;
        }

        #ghostLayer .typed {
            color: #f8f8f2;
        }

        #ghostLayer .ghost {
            color: rgba(248, 248, 242, 0.35);
        }

        [data-theme="light"] #ghostLayer .ghost {
            color: rgba(0, 0, 0, 0.35);
        }

        [data-theme="light"] #ghostLayer .typed {
            color: #657b83;
        }

        .code-area {
            width: 100%;
            min-height: 300px;
            padding: 20px;
            font-family: 'Source Code Pro', monospace;
            font-size: 1rem;
            line-height: 1.6;
            background: transparent;
            color: transparent;
            caret-color: #f8f8f2;
            border: none;
            resize: none;
            outline: none;
            tab-size: 4;
            position: relative;
            z-index: 1;
        }

        .code-area::placeholder {
            color: rgba(248, 248, 242, 0.4);
        }
        
        [data-theme="light"] .code-area {
            color: transparent;
            caret-color: #657b83;
        }

        [data-theme="light"] .code-area::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }

        .inline-hint {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--light-gray);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .inline-hint.is-visible {
            opacity: 1;
        }

        .output-area {
            background: rgba(23, 33, 50, 0.9);
            padding: 15px;
            min-height: 150px;
            overflow-y: auto;
            max-height: 300px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) rgba(0, 0, 0, 0.1);
        }

        .output-area::-webkit-scrollbar {
            width: 6px;
        }

        .output-area::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        .output-area::-webkit-scrollbar-thumb {
            background-color: var(--accent);
            border-radius: 3px;
        }

        .output-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
        }

        .ai-response {
            background: rgba(67, 97, 238, 0.1);
            border-left: 3px solid var(--accent);
            padding: 15px;
            margin-top: 15px;
        }

        .ai-floating-window {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 380px;
            height: calc(100vh - 100px);
            z-index: 1000;
            background: rgba(30, 41, 59, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease-in-out;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ai-floating-window.hidden {
            transform: translateX(calc(100% + 20px));
        }

        .ai-assistant-section {
            width: 350px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            gap: 20px;
            height: 100%;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ai-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--ai-purple), #6a0dad);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .ai-title {
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(to right, #9d4edd, var(--ai-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ai-status {
            font-size: 0.9rem;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .ai-status::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--ai-purple) rgba(0, 0, 0, 0.1);
            height: 0;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background-color: var(--ai-purple);
            border-radius: 3px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        .ai-message {
            background: rgba(138, 43, 226, 0.15);
            border-bottom-left-radius: 0;
            align-self: flex-start;
        }

        .user-message {
            background: rgba(67, 97, 238, 0.2);
            border-bottom-right-radius: 0;
            margin-left: auto;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .message-content {
            line-height: 1.5;
            max-height: none;
            overflow: visible;
            word-wrap: break-word;
        }

        .ai-message .message-content {
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .ai-message p {
            margin-bottom: 12px;
        }

        .ai-message .section-title {
            display: block;
            font-size: 1.05rem;
            color: var(--accent);
            margin: 18px 0 10px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
        }

        .ai-message ul {
            padding-left: 20px;
            margin-bottom: 12px;
        }

        .ai-message li {
            margin-bottom: 6px;
            position: relative;
        }

        .ai-message pre {
            background: var(--code-bg);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .ai-message code:not(pre code) {
            background: rgba(67, 97, 238, 0.2);
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
            font-size: 1rem;
            outline: none;
        }

        .message-input::placeholder {
            color: var(--light-gray);
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--ai-purple);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: #9d4edd;
        }

        .back-to-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        
        [data-theme="light"] .back-to-home-btn {
            background: rgba(0,0,0,0.1);
            color: var(--light);
        }

        .back-to-home-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .back-to-home-btn.is-disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .ai-toggle-btn {
            position: fixed;
            left: 20px;
            top: 50%;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: white;
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
            z-index: 1001;
            user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
            transform: translateY(-50%);
            overflow: hidden;
        }


        .ai-toggle-btn:active {
            cursor: grabbing;
        }

        .ai-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .ai-floating-window {
                width: 320px;
                right: 15px;
            }
        }

        @media (max-width: 900px) {
            .ai-floating-window {
                position: static;
                width: 100%;
                height: auto;

                box-shadow: none;

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetchCurrentUser();
            loadProblem();
            
            // --- 主题切换功能 ---
            const themeSelector = document.getElementById('themeSelector');
            const savedTheme = localStorage.getItem('selectedTheme') || 'default';

            document.documentElement.setAttribute('data-theme', savedTheme === 'default' ? null : savedTheme);
            themeSelector.value = savedTheme;

            themeSelector.addEventListener('change', function () {
                const theme = this.value;

                    document.documentElement.removeAttribute('data-theme');
                } else {
                    document.documentElement.setAttribute('data-theme', theme);
                }
                localStorage.setItem('selectedTheme', theme);
            });
        });

        async function fetchCurrentUser() {
            try {
                const response = await fetch('/api/current_user');
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        updateUserInfo(result.user);
                    } else {
                        showLoginRegister();
                    }
                } else {
                    showLoginRegister();
                }
            } catch (error) {
                console.error('获取用户信息失败', error);
                showLoginRegister();
            }
        }

        function updateUserInfo(user) {
            const userInfoDiv = document.querySelector('.user-info');
            userInfoDiv.innerHTML = `
                <div class="user-details">
                    <div class="username">${user.username}</div>
                    <div class="user-stats">
                        <span>积分: ${user.points}</span>

                    </div>

                <div class="user-avatar" id="userAvatar">
                    <img src="https://mms1.baidu.com/it/u=1390447151,3494080119&fm=253&app=138&f=JPEGw=500&h=500">
                </div>
            `;
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        }

        function showLoginRegister() {
            const userInfoDiv = document.querySelector('.user-info');
            userInfoDiv.innerHTML = `
                <div style="display: flex; gap: 10px;">
                    <a href="/login.html" class="btn">登录</a>
                    <a href="/register.html" class="btn" style="background: var(--primary);">注册</a>
                </div>
            `;
        }

        async function handleLogout(e) {
            e.preventDefault();
            await fetch('/api/logout', { method: 'POST' });
            alert("已成功登出");
            window.location.href = '/index.html';
        }


        function getCurrentProblemId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('problem');
        }

        let problemOrderCache = null;

        async function getProblemOrder() {
            if (problemOrderCache) {
                return problemOrderCache;
            }
            const response = await fetch('/api/problems');
            const result = await response.json();
            if (!result.success || !result.problems) {
                return [];
            }
            problemOrderCache = result.problems.map((p) => p.id);
            return problemOrderCache;
        }

        async function updateNextButtonState() {
            if (!nextProblemBtn) {
                return;
            }
            try {
                const currentId = getCurrentProblemId();
                if (!currentId) {
                    nextProblemBtn.classList.add('is-disabled');
                    return;
                }
                const order = await getProblemOrder();
                const currentIndex = order.indexOf(currentId);
                const hasNext = currentIndex >= 0 && currentIndex + 1 < order.length;
                nextProblemBtn.classList.toggle('is-disabled', !hasNext);
                nextProblemBtn.title = hasNext ? '' : '已是最后一题';
            } catch (error) {
                nextProblemBtn.classList.add('is-disabled');
                nextProblemBtn.title = '已是最后一题';
            }
        }

        async function loadProblem() {
            const problemId = getCurrentProblemId();
            const problemTitleEl = document.querySelector('.problem-title');
            const problemContentEl = document.querySelector('.problem-content');

            if (!problemId) {
                problemTitleEl.textContent = '无效的题目';
                problemContentEl.innerHTML = '<h2>请先通过题目列表选择一个题目</h2>';
                return;
            }

            try {
                const response = await fetch(`/api/problems/${problemId}`);
                const result = await response.json();

                if (result.success && result.problem) {
                    const problem = result.problem;
                    let difficultyClass = 'difficulty-easy';
                    if (problem.difficulty && problem.difficulty.toLowerCase().includes('中等')) {
                        difficultyClass = 'difficulty-medium';
                    } else if (problem.difficulty && problem.difficulty.toLowerCase().includes('困难')) {
                        difficultyClass = 'difficulty-hard';
                    }

                    problemTitleEl.innerHTML = `
                        <span>${problem.title || '无标题'}</span>
                        <div class="problem-meta">
                            <span class="problem-difficulty ${difficultyClass}">${problem.difficulty || '未知'}</span>
                        </div>
                    `;
                    problemContentEl.innerHTML = problem.description || '<p>该题目没有描述信息。</p>';
                } else {
                    problemTitleEl.textContent = '加载失败';
                    problemContentEl.innerHTML = `<p>无法加载题目详情，错误：${result.error || '未知错误'}</p>`;
                }

            } catch (error) {
                console.error('加载题目失败:', error);
                problemTitleEl.textContent = '加载失败';
                problemContentEl.innerHTML = `<p>请求题目数据时发生网络错误: ${error.message}</p>`;
            }
            await updateNextButtonState();
        }
        
        // DOM元素
        const codeInput = document.getElementById('codeInput');
        const outputContent = document.getElementById('outputContent');
        const aiSuggestion = document.getElementById('aiSuggestion');
        const runBtn = document.getElementById('runBtn');
        const optimizeBtn = document.getElementById('optimizeBtn');
        const submitBtn = document.getElementById('submitBtn');
        const nextProblemBtn = document.getElementById('nextProblemBtn');
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendMessageBtn = document.getElementById('sendMessage');
        const ghostLayer = document.getElementById('ghostLayer');
        const inlineHint = document.getElementById('inlineHint');

        let inlineSuggestion = '';
        let inlineAbortController = null;
        let inlineRequestId = 0;
        let inlineDebounceTimer = null;

        function getCursorContext() {
            const text = codeInput.value || '';
            const start = codeInput.selectionStart || 0;
            const end = codeInput.selectionEnd || start;
            const rawPrefix = text.slice(0, start);
            const rawSuffix = text.slice(end);
            const prefix = rawPrefix.slice(-2000);
            const suffix = rawSuffix.slice(0, 800);
            return { prefix, suffix, start, end };
        }

        function renderGhostLayer() {
            if (!ghostLayer || !codeInput) {
                return;
            }
            const text = codeInput.value || '';
            const start = codeInput.selectionStart || 0;
            const end = codeInput.selectionEnd || start;
            const prefix = text.slice(0, start);
            const suffix = text.slice(end);
            const ghost = start === end ? inlineSuggestion : '';
            ghostLayer.innerHTML = `<span class="typed">${escapeHtml(prefix)}</span><span class="ghost">${escapeHtml(ghost)}</span><span class="typed">${escapeHtml(suffix)}</span>`;
            ghostLayer.scrollTop = codeInput.scrollTop;
            ghostLayer.scrollLeft = codeInput.scrollLeft;
            if (inlineHint) {
                inlineHint.classList.toggle('is-visible', ghost.length > 0);
            }
        }

        function clearInlineSuggestion() {
            inlineSuggestion = '';
            renderGhostLayer();
        }

        function scheduleInlineCompletion(force = false) {
            if (!codeInput) {
                return;
            }
            if (inlineDebounceTimer) {
                clearTimeout(inlineDebounceTimer);
            }
            if (force) {
                inlineRequestId += 1;
                requestInlineCompletion(inlineRequestId);
                return;
            }
            inlineDebounceTimer = setTimeout(() => {
                inlineRequestId += 1;
                requestInlineCompletion(inlineRequestId);
            }, 200);
        }

        async function requestInlineCompletion(requestId) {
            const { prefix, suffix, start, end } = getCursorContext();
            if (start !== end || prefix.length < 5) {
                clearInlineSuggestion();
                return;
            }
            if (inlineAbortController) {
                inlineAbortController.abort();
            }
            inlineAbortController = new AbortController();
            const language = document.getElementById('languageSelector').value || 'python';

            try {
                const response = await fetch('/api/ai-inline-complete-stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language,
                        prefix,
                        suffix,
                        max_tokens: 128
                    }),
                    signal: inlineAbortController.signal
                });
                if (!response.ok || !response.body) {
                    clearInlineSuggestion();
                    return;
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        break;
                    }
                    buffer += decoder.decode(value, { stream: true });
                    if (requestId !== inlineRequestId) {
                        return;
                    }
                    inlineSuggestion = buffer;
                    renderGhostLayer();
                }
            } catch (error) {
                clearInlineSuggestion();
            }
        }

        function acceptInlineSuggestion() {
            if (!inlineSuggestion) {
                return;
            }
            const text = codeInput.value || '';
            const start = codeInput.selectionStart || 0;
            const end = codeInput.selectionEnd || start;
            codeInput.value = text.slice(0, start) + inlineSuggestion + text.slice(end);
            const newPos = start + inlineSuggestion.length;
            codeInput.setSelectionRange(newPos, newPos);
            clearInlineSuggestion();
        }

        if (codeInput) {
            codeInput.addEventListener('input', () => {
                clearInlineSuggestion();
                scheduleInlineCompletion();
            });
            codeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Tab' && inlineSuggestion) {
                    e.preventDefault();
                    acceptInlineSuggestion();
                    return;
                }
                if (e.key === 'Escape' && inlineSuggestion) {
                    e.preventDefault();
                    clearInlineSuggestion();
                    return;
                }
                if (e.ctrlKey && e.key === ' ') {
                    e.preventDefault();
                    scheduleInlineCompletion(true);
                }
            });
            codeInput.addEventListener('click', renderGhostLayer);
            codeInput.addEventListener('keyup', renderGhostLayer);
            codeInput.addEventListener('scroll', () => {
                if (!ghostLayer) {
                    return;
                }
                ghostLayer.scrollTop = codeInput.scrollTop;
                ghostLayer.scrollLeft = codeInput.scrollLeft;
            });
            renderGhostLayer();
        }

        if (nextProblemBtn) {
            nextProblemBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                if (nextProblemBtn.classList.contains('is-disabled')) {
                    return;
                }
                try {
                    const currentId = getCurrentProblemId();
                    if (!currentId) {
                        alert('请先选择题目');
                        return;
                    }
                    const order = await getProblemOrder();
                    const currentIndex = order.indexOf(currentId);
                    const nextId = currentIndex >= 0 ? order[currentIndex + 1] : null;
                    if (!nextId) {
                        alert('已经是最后一题');
                        return;
                    }
                    window.location.href = `/practice.html?problem=${encodeURIComponent(nextId)}`;
                } catch (error) {
                    alert(`获取下一题失败: ${error.message}`);
                }
            });
        }
        const aiFloatingWindow = document.getElementById('aiFloatingWindow');
        const aiToggleBtn = document.getElementById('aiToggleBtn');

        let globalOptimizedVersions = [];

        function escapeHtml(text) {
            var map = {
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            };
            return String(text || '').replace(/[&<>"']/g, function (m) { return map[m]; });
        }

                    // 记录页面加载的时间戳
            const startTime = Date.now();

            // 当用户准备离开页面时（关闭、刷新、跳转）触发
            window.addEventListener('beforeunload', function(event) {
                // 计算停留时长（秒）
                const endTime = Date.now();
                const durationInSeconds = Math.round((endTime - startTime) / 1000);

                // 只有当停留时间超过10秒时才记录，避免无效数据
                if (durationInSeconds > 10) {
                    // 使用 navigator.sendBeacon 发送数据
                    // 这种方式可以确保即使用户关闭了页面，请求也能大概率成功发送
                    const data = new Blob(
                        [JSON.stringify({ duration: durationInSeconds })],
                        { type: 'application/json' }
                    );
                    navigator.sendBeacon('/api/update_learning_time', data);
                }
            });

            // 注意：为了让 sendBeacon 生效，需要确保后端API支持 application/json
            // Flask 默认支持，但如果您的服务器配置了严格的CORS或内容类型策略，请确保允许。
            // 如果 sendBeacon 不可用或被阻止，可以退回到使用同步的 XMLHttpRequest，但这会阻塞页面关闭，体验不佳。

        function formatAiResponse(text) {
            if (!text) return '';
            text = text.replace(/---/g, '<hr>');
            text = text.replace(/^######\s*(.*)$/gm, '<h6>$1</h6>');
            text = text.replace(/^#####\s*(.*)$/gm, '<h5>$1</h5>');
            text = text.replace(/^####\s*(.*)$/gm, '<h4>$1</h4>');
            text = text.replace(/^###\s*(.*)$/gm, '<h3>$1</h3>');
            text = text.replace(/^##\s*(.*)$/gm, '<h2>$1</h2>');
            text = text.replace(/^#\s*(.*)$/gm, '<h1>$1</h1>');
            text = text.replace(/^([一二三四五六七八九十]+、[^\n]+)/gm, '<span class="section-title">$1</span>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>');
            text = text.replace(/^\s*([*-])\s+(.*)$/gm, '<li>$2</li>');
            text = text.replace(/(<li>.*?<\/li>(\n<li>.*?<\/li>)*)/g, '<ul>$1</ul>');
            text = text.replace(/\n\s*\n/g, '</p><p>').replace(/\n/g, '<br>');
            return `<div class="ai-formatted-content">${text}</div>`;
        }

        function applyOptimizedCode(versionIndex) {
            if (versionIndex >= 0 && versionIndex < globalOptimizedVersions.length) {
                codeInput.value = globalOptimizedVersions[versionIndex].code;
                renderGhostLayer();
                aiSuggestion.innerHTML = `<div style="color:var(--success); text-align:center; padding:20px;"><i class="fas fa-check-circle"></i> 代码已应用！请检查代码编辑器。</div>`;
            } else {
                console.error("Error: Invalid version index provided:", versionIndex);
                aiSuggestion.innerHTML = `<div style="color:var(--warning); text-align:center; padding:20px;"><i class="fas fa-exclamation-triangle"></i> 应用优化代码失败：无效的版本。</div>`;
            }
        }

        async function runCode() {
            const code = codeInput.value;
            const customInput = document.getElementById('customInput').value;
            const language = document.getElementById('languageSelector').value;
            outputContent.innerHTML = '<p style="color: var(--accent)">执行中...</p>';
            runBtn.disabled = true;
            runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 运行中';

            try {
                const response = await fetch('/api/run-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, language, input_text: customInput })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || errorData.message || `服务器返回错误: ${response.status} ${response.statusText}`);
                }

                const result = await response.json();
                if (result.success) {
                    outputContent.innerHTML = `<div style="margin-bottom:8px; color:var(--success)"><i class="fas fa-check-circle"></i> 执行成功 (${result.time}ms)</div><pre style="background:rgba(76,201,240,0.1); padding:12px; border-radius:6px;">${result.output || '无输出内容'}</pre>`;
                } else {
                    outputContent.innerHTML = `<div style="margin-bottom:8px; color:var(--warning)"><i class="fas fa-times-circle"></i> 执行失败 (${result.time}ms)</div><div style="color:var(--warning); margin-bottom:8px;">${language}环境错误:</div><pre style="background:rgba(247,37,133,0.1); padding:12px; border-radius:6px;">${result.error || '未知错误'}</pre>${result.stderr ? `<pre style="background:rgba(247,37,133,0.1); padding:12px; border-radius:6px; margin-top:8px;">${result.stderr}</pre>` : ''}`;
                }
            } catch (error) {
                console.error('代码执行错误:', error);
                outputContent.innerHTML = `<div style="margin-bottom:8px; color:var(--warning)"><i class="fas fa-exclamation-triangle"></i> 请求失败</div><pre style="background:rgba(247,37,133,0.1); padding:12px; border-radius:6px;">${error.message}</pre>${!navigator.onLine ? '<p style="color:var(--warning)">检测到网络离线</p>' : ''}<p style="color:var(--light-gray); margin-top:10px;">提示: 请确保已安装${language}运行环境并配置正确</p>`;
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = '<i class="fas fa-play"></i> 运行代码';
                outputContent.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // 优化代码
        async function optimizeCode() {
            const code = document.getElementById('codeInput').value;
            const aiSuggestion = document.getElementById('aiSuggestion');

            if (!code.trim()) {
                aiSuggestion.innerHTML = '<span style="color:var(--warning)">请输入需要优化的代码</span>';
                return;
            }

            const optimizeBtn = document.getElementById('optimizeBtn');
            optimizeBtn.disabled = true;
            optimizeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 优化中';

            aiSuggestion.innerHTML = `
                <div style="display:flex; align-items:center; gap:8px; color:var(--accent)">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>正在使用AI优化代码...</span>
                </div>
            `;

            try {
                const response = await fetch('/api/optimize-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ code })
                });

                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    // 将获取到的优化版本存储到全局变量
                    globalOptimizedVersions = result.optimizedVersions; // <--- 关键：保存到全局变量

                    let versionsHtml = '';
                    if (globalOptimizedVersions && globalOptimizedVersions.length > 0) {
                        versionsHtml = globalOptimizedVersions.map((version, index) => `
                            <div class="optimized-version-card" style="margin-bottom:15px; border:1px solid var(--light-gray); padding:10px; border-radius:8px; background-color: var(--darker);">
                                <div style="font-weight:600; margin-bottom:5px; color:var(--accent);">
                                    ${version.description || `优化版本 ${index + 1}`}
                                </div>
                                <div class="code-block" style="margin-bottom:10px; font-size:0.9rem; max-height: 200px; overflow-y: auto; background-color: var(--dark); padding: 8px; border-radius: 4px;">
                                    <pre style="margin:0; white-space: pre-wrap; word-break: break-all;">${escapeHtml(version.code)}</pre>
                                </div>
                                <button class="btn btn-run btn-sm" style="width:100%; background-color: var(--primary);"
                                    onclick="applyOptimizedCode(${index})"> <i class="fas fa-check-square"></i> 应用此版本
                                </button>
                            </div>
                        `).join('');
                    } else {
                        versionsHtml = `<p style="color:var(--warning);">未能生成优化版本，或AI返回格式不符预期。</p>`;
                    }

                    aiSuggestion.innerHTML = `
                        <div style="color:var(--success)">
                            <i class="fas fa-check-circle"></i> 优化完成！
                        </div>
                        <div style="margin: 10px 0; font-weight:500"></div>
                        <div style="margin-bottom:10px; padding:8px; background:rgba(76,201,240,0.1); border-radius:6px;">
                            ${formatAiResponse(result.feedback) || '代码已优化，性能更优'} </div>
                        <div style="margin: 10px 0; font-weight:500">优化版本选择：</div>
                        ${versionsHtml}
                    `;
                } else {
                    aiSuggestion.innerHTML = `<div style="color:var(--warning)"><i class="fas fa-exclamation-triangle"></i> AI优化失败: ${result.error}</div>`;
                }
            } catch (error) {
                aiSuggestion.innerHTML = `<div style="color:var(--warning)"><i class="fas fa-exclamation-triangle"></i> 请求失败: ${error.message}</div>`;
                console.error('优化代码请求错误:', error);
            } finally {
                optimizeBtn.disabled = false;
                optimizeBtn.innerHTML = '<i class="fas fa-cogs"></i> AI优化';
            }
        }

        async function submitCode() {
            const code = codeInput.value;
            const language = document.getElementById('languageSelector').value;
            const urlParams = new URLSearchParams(window.location.search);
            const problemId = urlParams.get('problem');

            if (!code.trim()) {
                outputContent.innerHTML = '<p style="color: var(--warning)">请先输入代码</p>';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中';
            outputContent.innerHTML = `<div style="display:flex; align-items:center; gap:10px;"><i class="fas fa-spinner fa-spin" style="color:var(--accent)"></i><span>正在提交代码并检查...</span></div>`;

            try {
                const response = await fetch('/api/check-solution', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, language, problem_id: problemId })
                });
                const result = await response.json();

                if (result.success && result.status === "Accepted") {
                    outputContent.innerHTML = `<div class="ai-response" style="border-left-color: var(--success);"><h4 style="color: var(--success); display: flex; align-items: center; gap: 8px;"><i class="fas fa-check-circle"></i><span>${result.status}</span></h4><pre style="white-space: pre-wrap;">${result.details || '通过！'}</pre></div>`;
                } else {
                    outputContent.innerHTML = `<div class="ai-response" style="border-left-color: var(--danger);"><h4 style="color: var(--danger); display: flex; align-items: center; gap: 8px;"><i class="fas fa-times-circle"></i><span>${result.status || '提交失败'}</span></h4><pre style="white-space: pre-wrap;">${result.details || result.error || '没有返回详细信息。'}</pre></div>`;
                }
            } catch (error) {
                outputContent.innerHTML = `<div style="margin-bottom:8px; color:var(--warning)"><i class="fas fa-exclamation-triangle"></i> 请求失败</div><pre style="background:rgba(247,37,133,0.1); padding:12px; border-radius:6px;">${error.message}</pre>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交解答';
                outputContent.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function addChatMessage(content, sender, id = null, isHtml = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            const header = document.createElement('div');
            header.className = 'message-header';
            header.innerHTML = sender === 'ai' ? '<i class="fas fa-robot"></i> AI助手' : '<i class="fas fa-user"></i> 你';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            if (id) contentDiv.id = id;
            if (sender === 'ai') {
                contentDiv.innerHTML = isHtml ? content : formatAiResponse(content);
            } else {
                contentDiv.textContent = content;
            }
            messageDiv.appendChild(header);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return contentDiv;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addChatMessage(message, 'user');
            messageInput.value = '';

            const aiId = `ai-${Date.now()}`;
            const aiContentDiv = addChatMessage('<span class="thinking">🤔 AI助手正在思考中...</span>', 'ai', aiId, true);

            try {
                const response = await fetch('/api/ai-chat-stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, language: 'Python' })
                });

                if (!response.ok) {
                    aiContentDiv.innerText = `错误: ${response.statusText}`;
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullText += decoder.decode(value, { stream: true });
                    aiContentDiv.innerHTML = formatAiResponse(fullText);
                }
            } catch (error) {
                aiContentDiv.innerText = `请求失败: ${error.message}`;
                console.error('聊天错误:', error);
            }
        }

        function toggleAiWindow() {
            aiFloatingWindow.classList.toggle('hidden');
        }

        runBtn.addEventListener('click', runCode);
        optimizeBtn.addEventListener('click', optimizeCode);
        submitBtn.addEventListener('click', submitCode);
        sendMessageBtn.addEventListener('click', sendMessage);
        aiToggleBtn.addEventListener('click', toggleAiWindow);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        codeInput.value = `# 示例Python代码\ndef greet(name):\n    return f"Hello, {name}!"\n\nprint(greet("World"))\n`;
        renderGhostLayer();

        // --- 拖拽功能 ---
        (function () {
            const btn = document.getElementById('aiToggleBtn');
            let isDragging = false, startX, startY, initialLeft, initialTop, isClick = true;

            function startDrag(e) {
                isDragging = true;
                isClick = true;
                const rect = btn.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
                if (e.type === 'mousedown') {
                    startX = e.clientX; startY = e.clientY;
                } else if (e.type === 'touchstart') {
                    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                }
                btn.style.transition = 'none';
                btn.style.boxShadow = '0 10px 25px rgba(138, 43, 226, 0.6)';
                e.preventDefault();
            }

            function duringDrag(e) {
                if (!isDragging) return;
                isClick = false;
                let currentX, currentY;
                if (e.type === 'mousemove') {
                    currentX = e.clientX; currentY = e.clientY;
                } else if (e.type === 'touchmove') {
                    currentX = e.touches[0].clientX; currentY = e.touches[0].clientY;
                }
                const dx = currentX - startX, dy = currentY - startY;
                btn.style.left = `${initialLeft + dx}px`;
                btn.style.top = `${initialTop + dy}px`;
                btn.style.right = 'auto';
                btn.style.bottom = 'auto';
                e.preventDefault();
            }

            function endDrag(e) {
                if (!isDragging) return;
                isDragging = false;
                btn.style.transition = 'all 0.3s ease';
                btn.style.boxShadow = '0 5px 15px rgba(138, 43, 226, 0.4)';
                if (!isClick) { e.preventDefault(); e.stopPropagation(); }
            }

            btn.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', duringDrag);
            document.addEventListener('mouseup', endDrag);
            btn.addEventListener('touchstart', startDrag, { passive: false });
            document.addEventListener('touchmove', duringDrag, { passive: false });
            document.addEventListener('touchend', endDrag);
            btn.addEventListener('click', function (e) {
                if (!isClick) { e.preventDefault(); e.stopPropagation(); }
            });
        })();

    </script>
