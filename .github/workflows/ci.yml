name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  launchers:
    name: Launchers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install setup test dependencies
        run: python -m pip install python-dotenv==1.2.2 SQLAlchemy
      - name: Test native launchers and setup safeguards
        run: python -m unittest tests.test_launchers tests.test_quickstart -v

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci

      - name: Lint Python
        run: ruff check .

      - name: Check Python formatting
        run: black --check .

      - name: Compile Python
        run: python -m compileall -q app.py models.py config.py routes services modules tests migrations

      - name: Build isolated code runner
        run: docker build -t codelab-runner:local sandbox

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run migrations on clean database
        run: |
          tmp_db="$(mktemp)"
          rm -f "$tmp_db"
          DATABASE_URL="sqlite:///$tmp_db" FLASK_SECRET_KEY=ci-secret flask --app app db upgrade

      - name: Check JavaScript syntax
        run: |
          for f in static/js/*.js modules/task_room/static/*.js modules/co_create/static/*.js; do
            node --check "$f"
          done

      - name: Run frontend controller regressions
        run: node --test tests/*.test.cjs

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run Playwright smoke tests
        run: |
          python scripts/prepare_competition_preview.py --database smoke.db
          DATABASE_URL="sqlite:///$(pwd)/smoke.db" FLASK_SECRET_KEY=ci-secret flask --app app run --host 127.0.0.1 --port 5005 &
          server_pid="$!"
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:5005/index.html", timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("Smoke test server did not start")
          PY
          SMOKE_BASE_URL="http://127.0.0.1:5005" npm run smoke

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --cache-dir /tmp/pip-audit-cache

      - name: Audit Node dependencies
        run: npm audit --audit-level=high
